name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site folder
        run: |
          rm -rf site
          mkdir -p site

          # Copy top-level static HTML tools.
          find . -maxdepth 1 -type f -name "*.html" -exec cp {} site/ \;

          # Copy common static asset folders if they exist.
          for dir in assets public images css js; do
            if [ -d "$dir" ]; then
              cp -R "$dir" site/
            fi
          done

          echo "Deploying these files:"
          find site -maxdepth 3 -type f -print

          if [ ! -f "site/index.html" ]; then
            echo "No site/index.html found. GitHub Pages needs a top-level index.html."
            exit 1
          fi

          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
