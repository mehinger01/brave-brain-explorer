name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - name: Prepare static site folder
        run: |
          rm -rf site
          mkdir site
          echo "Build output folders:"
          find . -maxdepth 3 -type f -name "index.html" -print

          if [ -f "dist/index.html" ]; then
            cp -R dist/* site/
          elif [ -f "dist/client/index.html" ]; then
            cp -R dist/client/* site/
          elif [ -f ".output/public/index.html" ]; then
            cp -R .output/public/* site/
          else
            echo "No deployable index.html found. Build output:" 
            find . -maxdepth 3 -type d -print
            exit 1
          fi

          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
