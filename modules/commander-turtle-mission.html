<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Commander Turtle Boss Battle</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#273f9b,#111a3c 42%,#071024);color:#fff;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{background:#ffd166;color:#302000;border:2px solid #fff;border-radius:999px;padding:7px 11px;font-weight:900}.panel{background:rgba(255,255,255,.11);border:3px solid rgba(255,255,255,.22);border-radius:24px;padding:14px;margin:10px 0}.card{background:#fff;color:#10233a;border-radius:26px;padding:18px;border:7px solid #84f59a;box-shadow:0 10px 0 #35a84f}.hidden{display:none!important}.big{font-size:clamp(1.5rem,4vw,2.35rem);text-align:center;margin:0 0 8px}.sub{color:#38506b;text-align:center;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.choice,.btn,.tool{border:0;border-radius:18px;padding:13px;min-height:52px;font-weight:900;cursor:pointer}.choice{background:#f4fbff;color:#10233a;border:3px solid #b8d7e6}.choice.selected{border-color:#725fd1;background:#efe7ff}.btn{background:#5ee4ff;color:#052334;box-shadow:0 5px 0 #2391ad}.btn.good{background:#68ff9c;box-shadow:0 5px 0 #25a74f}.btn.warn{background:#ffd166;box-shadow:0 5px 0 #bd831d}.btn.purple{background:#b49cff;box-shadow:0 5px 0 #725fd1}.btn.red{background:#ff8a8a;box-shadow:0 5px 0 #bd4343}.steps{display:flex;gap:6px;flex-wrap:wrap}.stepDot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#d7ecf5;color:#10233a;font-weight:900}.stepDot.on{background:#ffd166}.stepDot.done{background:#68ff9c}.callout{background:#fff8d8;border:4px solid #ffd166;border-radius:20px;padding:16px;text-align:center}.workspace{position:relative;min-height:430px;border:5px dashed #b49cff;border-radius:22px;background:linear-gradient(#dff4ff 0 45%,#9dd9ff 45% 68%,#d6f0a5 68%);overflow:hidden;touch-action:none}.turtle,.flag,.hazard{position:absolute;font-size:54px;user-select:none}.turtle{left:4%;bottom:16%}.flag{right:4%;bottom:16%}.hazard{left:44%;bottom:20%;font-size:70px}.tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.tool{background:#eef9ff;border:3px solid #9fc7d8;color:#10233a}.piece{position:absolute;min-width:90px;min-height:48px;border:3px solid #22364f;border-radius:10px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;cursor:move;overflow:visible}.piece.selected{outline:4px solid #ffd166}.road{background:repeating-linear-gradient(90deg,#4c5560 0 26px,#f4d35e 26px 34px,#4c5560 34px 60px);height:56px}.bridge{background:repeating-linear-gradient(90deg,#9b6a3f 0 18px,#d59a5b 18px 34px);height:64px;border-top:8px solid #654321;border-bottom:8px solid #654321}.brick{background:repeating-linear-gradient(0deg,#b45d3a 0 20px,#eee 20px 23px);width:100px;height:72px}.ramp{background:linear-gradient(155deg,transparent 0 48%,#727d89 49% 100%);height:85px;width:125px;border:none}.boat{background:#2a8cc7;height:55px;border-radius:10px 10px 40px 40px}.rope{height:14px;background:repeating-linear-gradient(45deg,#9b6a3f 0 8px,#d4a66d 8px 16px);border-radius:999px}.resize{position:absolute;width:24px;height:24px;right:-12px;bottom:-12px;border-radius:50%;background:#ffd166;border:3px solid #302000;cursor:nwse-resize}.delete{position:absolute;width:26px;height:26px;right:-12px;top:-12px;border-radius:50%;background:#ff8a8a;color:#fff;border:2px solid #fff;display:grid;place-items:center;font-weight:900;cursor:pointer}.budget{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.cost{background:#efe7ff;border-radius:999px;padding:7px 10px;font-weight:900}.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:auto}.mem{background:#eef9ff;border:3px solid #9fc7d8;border-radius:16px;min-height:78px;display:grid;place-items:center;font-size:2.1rem}.bossHearts{font-size:2rem;text-align:center}.lockedBox{filter:blur(4px);opacity:.6}.secret{background:#efe7ff;border:4px solid #b49cff;border-radius:20px;padding:16px}.small{font-size:.9rem;color:#38506b}.center{text-align:center}textarea,input{width:100%;border:3px solid #b8d7e6;border-radius:14px;padding:11px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}.workspace{min-height:360px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>🐢 Commander Turtle: Boss Battle</h1><div>One mission. Lots of surprises.</div></div><div class="badge">⭐ Power Crystals: <span id="crystals">0</span></div></div>
  <div class="panel"><div class="steps" id="steps"></div></div>
  <main id="stage" class="card"></main>
  <div class="row"><a class="btn" href="https://mehinger01.github.io/brave-brain-explorer/" style="text-decoration:none">← Mission Control</a></div>
</div>
<script>
(function(){
const stages=['Mission','Route','Build','Trickster','Power-Up','Memory','Rule Shift','Mini Boss','Boss Battle','Your Turn','Secret Level','Debrief'];
let current=0,crystals=0,mission='Island Rescue',advantage='',route='Safe Route',budget=10,spent=0,boss=3,lastTrick=-1,lastRule=-1,selectedPiece=null,drag=null,resize=null,startX=0,startY=0,startW=0,startH=0,startL=0,startT=0;
const stage=document.getElementById('stage'),steps=document.getElementById('steps');
const missions=[['🏝️ Island Rescue','Creatures are trapped as the island floods.'],['🚀 Space Station Escape','Mission Control is breaking down in space.'],['💎 Power Crystal Heist','The Trickster stole Mission Control’s power source.']];
const tricks=['Your bridge just broke.','You lost 3 build points.','Boats are no longer allowed.','The destination moved.','One road is blocked.','Commander Turtle must rescue a friend too.','Remove one piece of your choice.','You may move pieces, but cannot add anything new.'];
const rules=['Reverse Controls: explain what should move while your coach controls the pieces.','Five Instructions Only: solve the next part using no more than five directions.','Silent Minute: communicate only by pointing or drawing.','One Tool Type: choose one kind of building piece and work with only that for the next move.','Mystery Rule: your coach chooses a secret rule. Test ideas until you figure it out.'];
const memorySets=[['🐢','🚀','🌳','🔑','🦖','🌉','🍕','⚙️'],['🐸','⭐','🚤','🎈','🧱','🛸','🐢','🌙'],['🎯','🦕','🔧','🚦','🏝️','🛟','🧠','🪁']];
function renderSteps(){steps.innerHTML='';stages.forEach((s,i)=>{const d=document.createElement('div');d.className='stepDot'+(i===current?' on':'')+(i<current?' done':'');d.textContent=i+1;d.title=s;steps.appendChild(d)});document.getElementById('crystals').textContent=crystals}
function next(){current=Math.min(stages.length-1,current+1);render()}
function pickButtons(container,cb,single=true){container.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(single)container.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.toggle('selected');cb&&cb(b)}))}
function nav(label='Continue'){return `<div class="row"><button id="nextBtn" class="btn good">${label} →</button></div>`}
function render(){renderSteps();window.scrollTo({top:0,behavior:'smooth'});const r=[missionScreen,routeScreen,buildScreen,trickScreen,powerScreen,memoryScreen,ruleScreen,miniBossScreen,bossScreen,yourTurnScreen,secretScreen,debriefScreen][current];r()}
function missionScreen(){stage.innerHTML=`<h2 class="big">Mission Alert</h2><p class="sub">Commander Turtle needs you. Choose the mission.</p><div id="missionChoices" class="grid">${missions.map(m=>`<button class="choice"><div style="font-size:2rem">${m[0].split(' ')[0]}</div><b>${m[0].substring(3)}</b><div class="small">${m[1]}</div></button>`).join('')}</div><h3 class="center">Choose one advantage</h3><div id="advChoices" class="grid"><button class="choice">🧰 Extra supplies</button><button class="choice">🗺️ Peek at an obstacle</button><button class="choice">🐢 Free Turtle Reset</button><button class="choice">💡 Unlimited hint</button></div>${nav('Launch Mission')}`;pickButtons(document.getElementById('missionChoices'),b=>mission=b.textContent.trim());pickButtons(document.getElementById('advChoices'),b=>advantage=b.textContent.trim());document.getElementById('nextBtn').onclick=next}
function routeScreen(){stage.innerHTML=`<h2 class="big">Choose Your Route</h2><p class="sub">There is more than one way to win.</p><div id="routes" class="grid"><button class="choice"><b>🛡️ Safe Route</b><div class="small">More stops. Friendlier surprises.</div><div>Reward: ⭐⭐</div></button><button class="choice"><b>⚡ Risky Route</b><div class="small">Fewer stops. Tougher surprises.</div><div>Reward: ⭐⭐⭐⭐</div></button></div><div class="callout"><b>Tell your coach:</b> Why did you choose that route?</div>${nav('Lock In Route')}`;pickButtons(document.getElementById('routes'),b=>route=b.textContent.includes('Risky')?'Risky Route':'Safe Route');document.getElementById('nextBtn').onclick=()=>{crystals+=route==='Risky Route'?4:2;next()}}
function buildScreen(){stage.innerHTML=`<h2 class="big">Build the Rescue Route</h2><p class="sub">Get Commander Turtle to the flag. Plan first, then build.</p><div class="budget"><span class="cost">Road 1</span><span class="cost">Brick 1</span><span class="cost">Ramp 2</span><span class="cost">Rope 2</span><span class="cost">Boat 3</span><span class="cost">Bridge 4</span></div><div class="center"><b>Build points left: <span id="budgetLeft">${budget-spent}</span></b></div><div id="workspace" class="workspace"><div class="turtle">🐢</div><div class="hazard">🌊</div><div class="flag">🏁</div></div><div class="tray"><button class="tool" data-kind="road" data-cost="1">🛣️ Road</button><button class="tool" data-kind="brick" data-cost="1">🧱 Brick Support</button><button class="tool" data-kind="ramp" data-cost="2">📐 Ramp</button><button class="tool" data-kind="rope" data-cost="2">🪢 Rope</button><button class="tool" data-kind="boat" data-cost="3">🚤 Rescue Boat</button><button class="tool" data-kind="bridge" data-cost="4">🌉 Bridge</button></div><div class="callout"><b>Fast finisher?</b> Try solving it again with two fewer build points, or invent a completely different route.</div>${nav('Route Ready')}`;setupBuild();document.getElementById('nextBtn').onclick=next}
function setupBuild(){const ws=document.getElementById('workspace');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{const cost=+b.dataset.cost;if(spent+cost>budget)return alert('Not enough build points for that piece.');spent+=cost;document.getElementById('budgetLeft').textContent=budget-spent;const p=document.createElement('div');p.className='piece '+b.dataset.kind;p.dataset.cost=cost;p.innerHTML='<span class="delete">×</span><span class="resize"></span>';p.style.left=(20+Math.random()*45)+'%';p.style.top=(20+Math.random()*45)+'%';ws.appendChild(p)});ws.addEventListener('pointerdown',e=>{const del=e.target.closest('.delete');if(del){const p=del.parentElement;spent=Math.max(0,spent-(+p.dataset.cost||0));document.getElementById('budgetLeft').textContent=budget-spent;p.remove();return}const rh=e.target.closest('.resize');const p=e.target.closest('.piece');if(!p)return;document.querySelectorAll('.piece').forEach(x=>x.classList.remove('selected'));p.classList.add('selected');selectedPiece=p;const wr=ws.getBoundingClientRect(),pr=p.getBoundingClientRect();startX=e.clientX;startY=e.clientY;startW=pr.width;startH=pr.height;startL=pr.left-wr.left;startT=pr.top-wr.top;if(rh){resize=p;rh.setPointerCapture(e.pointerId)}else{drag=p;p.setPointerCapture(e.pointerId)}});ws.addEventListener('pointermove',e=>{if(resize){resize.style.width=Math.max(70,startW+e.clientX-startX)+'px';resize.style.height=Math.max(32,startH+e.clientY-startY)+'px'}else if(drag){const wr=ws.getBoundingClientRect();drag.style.left=Math.max(0,Math.min(wr.width-drag.offsetWidth,startL+e.clientX-startX))+'px';drag.style.top=Math.max(0,Math.min(wr.height-drag.offsetHeight,startT+e.clientY-startY))+'px'}});ws.addEventListener('pointerup',()=>{drag=null;resize=null})}
function trickScreen(){stage.innerHTML=`<h2 class="big">🎭 Trickster Attack</h2><p class="sub">Your first plan worked. Now the rules change.</p><div id="trick" class="callout"><h2>Press reveal when you are ready.</h2></div><div class="row"><button id="reveal" class="btn purple">Reveal Surprise</button></div><h3 class="center">What is your next move?</h3><div id="moves" class="grid"><button class="choice">💪 Try one small change</button><button class="choice">💡 Ask for a hint</button><button class="choice">🐢 Use a Turtle Reset</button></div>${nav('I Adapted')}`;document.getElementById('reveal').onclick=()=>{let n;do{n=Math.floor(Math.random()*tricks.length)}while(n===lastTrick);lastTrick=n;document.getElementById('trick').innerHTML=`<h2>${tricks[n]}</h2><p>You may change the plan. Do not throw away everything and start over.</p>`};pickButtons(document.getElementById('moves'));document.getElementById('nextBtn').onclick=()=>{crystals++;next()}}
function powerScreen(){stage.innerHTML=`<h2 class="big">⚡ Recharge Mission Control</h2><p class="sub">Choose one quick power-up challenge.</p><div class="grid"><a class="choice center" href="https://mehinger01.github.io/brave-brain-explorer/" style="text-decoration:none">✏️🔵<br><b>Dot Lab</b></a><a class="choice center" href="https://mehinger01.github.io/brave-brain-explorer/" style="text-decoration:none">🏝️🔎<br><b>Search Beach</b></a><a class="choice center" href="https://mehinger01.github.io/brave-brain-explorer/" style="text-decoration:none">🧠⛰️<br><b>Memory Mountain</b></a><a class="choice center" href="https://mehinger01.github.io/brave-brain-explorer/" style="text-decoration:none">🎨<br><b>Creation Cove</b></a></div><div class="callout">Complete one quick challenge, then come back here and press <b>Power Restored</b>.</div>${nav('Power Restored')}`;document.getElementById('nextBtn').onclick=()=>{crystals++;next()}}
function memoryScreen(){const set=memorySets[Math.floor(Math.random()*memorySets.length)];stage.innerHTML=`<h2 class="big">🧠 Memory Mission</h2><p class="sub">Study the scene. When you are ready, hide it and test your memory.</p><div id="memGrid" class="memoryGrid">${set.map(x=>`<div class="mem">${x}</div>`).join('')}</div><div class="row"><button id="hideMem" class="btn warn">Hide the Scene</button><button id="changeMem" class="btn purple">New Scene</button></div><div id="memQuestions" class="callout hidden"><p>How many objects can you remember?</p><p>Which objects were transportation?</p><p>Which object was hardest to remember?</p><p>Now ask your coach one memory question.</p></div>${nav('Memory Mission Complete')}`;document.getElementById('hideMem').onclick=()=>{document.getElementById('memGrid').classList.add('lockedBox');document.getElementById('memQuestions').classList.remove('hidden')};document.getElementById('changeMem').onclick=memoryScreen;document.getElementById('nextBtn').onclick=()=>{crystals++;next()}}
function ruleScreen(){stage.innerHTML=`<h2 class="big">🔀 Rule Shift</h2><p class="sub">This surprise changes how you solve the challenge.</p><div id="ruleCard" class="callout"><h2>Ready for the new rule?</h2></div><div class="row"><button id="ruleBtn" class="btn purple">Reveal Rule</button></div>${nav('Rule Shift Complete')}`;document.getElementById('ruleBtn').onclick=()=>{let n;do{n=Math.floor(Math.random()*rules.length)}while(n===lastRule);lastRule=n;document.getElementById('ruleCard').innerHTML=`<h2>${rules[n]}</h2><p>Work with the new rule instead of fighting it.</p>`};document.getElementById('nextBtn').onclick=()=>{crystals++;next()}}
function miniBossScreen(){stage.innerHTML=`<h2 class="big">🛡️ Security System</h2><p class="sub">Three quick challenges stand between you and the Boss Battle.</p><div class="two"><div class="callout"><h3>1. Odd One Out</h3><div style="font-size:2rem">🐢 🐸 🦖 🚀 🐰</div><p>Which one does not belong? Explain your rule.</p></div><div class="callout"><h3>2. Opposites</h3><p>Your coach says a word. Say the opposite as fast as you can.</p><p><b>up • hot • fast • open • loud</b></p></div></div><div class="callout"><h3>3. Turtle Tap</h3><p>Tap your desk only when your coach says <b>turtle</b>. Do nothing for frog, tortoise, shell, or green.</p></div>${nav('Security Cleared')}`;document.getElementById('nextBtn').onclick=()=>{crystals+=2;next()}}
function bossScreen(){stage.innerHTML=`<h2 class="big">🎭 THE TRICKSTER'S FORTRESS</h2><div id="hearts" class="bossHearts">❤️ ❤️ ❤️</div><p class="sub">Three successful adaptations defeat the Trickster.</p><div id="bossCard" class="callout"><h2>Stage 1: Build a route to the Power Crystal.</h2><p>You have one hint and one Turtle Reset.</p></div><div class="row"><button id="bossHit" class="btn good">Adaptation Successful!</button><button id="bossTwist" class="btn purple">Reveal Next Twist</button></div><div class="callout"><b>Boss rule:</b> Each time the plan changes, keep at least one part of the old plan.</div>${nav('Boss Defeated')}`;const twists=['The Trickster removes one bridge.','A second rescue target appears.','You lose one tool type.','The safe path moves to the other side.'];document.getElementById('bossTwist').onclick=()=>document.getElementById('bossCard').innerHTML=`<h2>${twists[Math.floor(Math.random()*twists.length)]}</h2><p>Adjust the plan and keep going.</p>`;document.getElementById('bossHit').onclick=()=>{boss=Math.max(0,boss-1);document.getElementById('hearts').textContent='❤️ '.repeat(boss)+'🖤 '.repeat(3-boss);if(boss===0)document.getElementById('bossCard').innerHTML='<h2>🏆 The Trickster is defeated!</h2><p>Your plan changed, but you kept going.</p>'};document.getElementById('nextBtn').onclick=()=>{crystals+=3;next()}}
function yourTurnScreen(){stage.innerHTML=`<h2 class="big">🎮 Zach Becomes the Trickster</h2><p class="sub">Now you design the challenge. Your coach has to solve it.</p><div class="grid"><div><label>Choose the setting<input placeholder="island, space station, jungle..."></label></div><div><label>Choose the obstacle<input placeholder="river, broken road, wall..."></label></div><div><label>Choose the rule<input placeholder="no bridges, only 5 moves..."></label></div><div><label>Choose the surprise<input placeholder="what changes halfway through?"></label></div></div><div class="callout"><h3>Your job</h3><p>Make the challenge fair enough to solve, but tricky enough that your coach has to think.</p><p>If your coach gets frustrated, decide what advice to give.</p></div>${nav('Challenge Complete')}`;document.getElementById('nextBtn').onclick=()=>{crystals+=2;next()}}
function secretScreen(){stage.innerHTML=`<h2 class="big">🎁 Secret Level Unlocked</h2><p class="sub">Choose your bonus challenge.</p><div id="secretChoices" class="grid"><button class="choice">🧠 Mystery Box<br><span class="small">Solve three weird riddles.</span></button><button class="choice">🎨 Impossible Invention<br><span class="small">Combine turtle + refrigerator + helicopter.</span></button><button class="choice">🕵️ Spot the Change<br><span class="small">Have your coach change three things in a scene.</span></button><button class="choice">🎮 Beat the Coach<br><span class="small">Pick a challenge and try to outperform your coach.</span></button></div><div id="secretDetail" class="secret"><h3>Choose a Secret Level.</h3></div>${nav('Secret Level Complete')}`;pickButtons(document.getElementById('secretChoices'),b=>{document.getElementById('secretDetail').innerHTML='<h3>'+b.textContent.trim()+'</h3><p>Make up the rules together and go!</p>'});document.getElementById('nextBtn').onclick=()=>{crystals++;next()}}
function debriefScreen(){stage.innerHTML=`<h2 class="big">🏅 Mission Debrief</h2><p class="sub">Which powers showed up today?</p><div id="badges" class="grid"><button class="choice">🏗️ Planner</button><button class="choice">🔄 Plan Changer</button><button class="choice">🐢 Comeback Power</button><button class="choice">🧠 Challenge Solver</button></div><div class="two"><label>Which one did you use the most?<textarea rows="3"></textarea></label><label>What should we put in the next mission?<textarea rows="3"></textarea></label></div><div class="callout"><h2>Mission Complete!</h2><p>You planned, adjusted, solved problems, and kept going when the mission changed.</p><p><b>Power Crystals earned: ${crystals}</b></p></div><div class="row"><button id="restart" class="btn purple">Play a New Mission</button><a class="btn" href="https://mehinger01.github.io/brave-brain-explorer/" style="text-decoration:none">Back to Mission Control</a></div>`;pickButtons(document.getElementById('badges'),null,false);document.getElementById('restart').onclick=()=>{current=0;crystals=0;spent=0;boss=3;render()}}
render();
})();
</script>
</body>
</html>
